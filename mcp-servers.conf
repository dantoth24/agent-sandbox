# MCP servers that `agent-sandbox mcp` can start and stop on this Mac.
# One section per server:
#
#   [name]
#   dir     = folder to run it in
#   command = what to run; a path with a slash is taken relative to dir
#   url     = where it answers, used to tell whether it is up (optional)
#   env.NAME = value   an environment variable for it (optional, repeatable)

[comfyui]
dir = ~/AI/comfyui-mcp-server
command = .venv/bin/python server.py
url = http://127.0.0.1:9000/mcp
